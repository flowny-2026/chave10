name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # toda segunda-feira às 8h UTC

jobs:
  audit-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chave10-novo/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chave10-novo/backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm audit --json > audit-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: backend-audit-report
          path: chave10-novo/backend/audit-report.json

  audit-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chave10-novo/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chave10-novo/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  syntax-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chave10-novo/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          for f in src/index.js src/routes/*.js src/middleware/*.js src/services/*.js src/utils/*.js; do
            node --check "$f" || exit 1
          done
          echo "All syntax checks passed"
